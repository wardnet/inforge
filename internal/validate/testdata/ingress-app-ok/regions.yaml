regions:
  us-east-1:
    slug: use1
    # An ingress (and the app/service records it fronts) realizes DNS records and
    # ACME certs against this authority — the global slice reuses it via
    # placementRegion, so it must be declared.
    dns:
      provider: cloudflare
      zone: env:INFORGE_TEST_INGRESS_APP_ZONE
    providers:
      hetzner:
        apiToken: test-token
        location: ash
        network_zone: us-east
        serverTypes: {SMALL: cx23, MEDIUM: cx33, LARGE: cx43}
        images: {ubuntu-24.04: ubuntu-24.04}
      cloudflare:
        apiToken: test-token
global:
  placementRegion: us-east-1
  providers:
    hetzner:
      apiToken: test-token
      location: ash
      network_zone: us-east
      serverTypes: {SMALL: cx23, MEDIUM: cx33, LARGE: cx43}
      images: {ubuntu-24.04: ubuntu-24.04}
    cloudflare:
      apiToken: test-token
