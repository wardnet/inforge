# us-east-1 declares NO dns: authority. The global slice (placementRegion:
# us-east-1) has a tls-termination service + ingress, which realize DNS records and
# ACME certs against the placement region's authority — so ValidateResources must
# reject this slice with a clear "no dns: authority" error.
regions:
  us-east-1:
    slug: use1
    providers:
      hetzner:
        apiToken: test-token
        location: ash
        network_zone: us-east
        serverTypes: {SMALL: cx23, MEDIUM: cx33, LARGE: cx43}
        images: {ubuntu-24.04: ubuntu-24.04}
global:
  placementRegion: us-east-1
  providers:
    hetzner:
      apiToken: test-token
      location: ash
      network_zone: us-east
      serverTypes: {SMALL: cx23, MEDIUM: cx33, LARGE: cx43}
      images: {ubuntu-24.04: ubuntu-24.04}
