name: api
container: bridge
host: bridge
type: raw
user: api
pki: wardnet-mesh
ingress: edge
routes:
  # tls-termination and a forward on one service: nginx terminates ACME TLS on
  # 443 and reverse-proxies to 8080, and stream-forwards 853 to a local backend.
  - type: tls-termination
    listen: 443
    target: 8080
    vanity:
      - api.{BASE_DOMAIN}
  - type: forward
    listen: 853
    target: 5353
grants:
  - resource: database/bridge
    permission: rw
    outputs:
      DATABASE_URL: "{URL}"
