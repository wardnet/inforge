name: api
container: bridge
host: bridge
type: raw
user: api
pki: wardnet-mesh
ingress:
  # tls-termination and a forward on one service: nginx terminates ACME TLS on
  # 443 and reverse-proxies to 8080, and stream-forwards 853 to a local backend.
  - type: tls-termination
    listen: 443
    target: 8080
    vanity:
      - api.{BASE_DOMAIN}
  - type: forward
    listen: 853
    target: 5353
grants:
  # A read-write DB user composed into one connection URL (value fields).
  - resource: database/bridge
    permission: rw
    outputs:
      TENANT_DB_URL: "{URL}"
  # A verify (ro) grant on a root-only PKI resource: the CA cert path (file field).
  - resource: pki/daemon
    permission: ro
    outputs:
      DAEMON_CA_CERT_PATH: "{CERT}"
