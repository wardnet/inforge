# A single region whose services reference a database that lives once, globally.
regions:
  us-east-1:
    slug: use1
    providers:
      neon:
        apiKey: test-key
      infisical:
        clientId: test-id
        clientSecret: test-secret
# The global slot carries provider config only (no slug): the global slice
# realizes against it with region-less naming.
global:
  placementRegion: us-east-1
  providers:
    neon:
      apiKey: test-key
      region: aws-us-east-2
