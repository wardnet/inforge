name: Install inforge
description: Download and install the inforge binary, the Pulumi CLI, and Pulumi provider plugins

inputs:
  version:
    description: inforge version to install (omit or set to "latest" for the latest release)
    default: latest
  pulumi-version:
    description: >-
      Pulumi CLI version to install. inforge drives the CLI through the Automation
      API, so this pins the engine that writes stack state. Override only to test a
      new CLI — the default is the version inforge is validated against.
    default: "3.253.0"

runs:
  using: composite
  steps:
    # inforge is NOT a pure-Go-SDK consumer of Pulumi: `auto.NewLocalWorkspace`
    # (cmd/inforge/stack.go) is the Automation API, which SHELLS OUT to a `pulumi`
    # binary on PATH. That dependency was previously implicit — nothing here
    # installed a CLI, so every consumer silently ran on whatever version its
    # runner image happened to ship, and a GitHub runner-image roll could change
    # the deploy engine underneath a pinned inforge release with no diff anywhere.
    #
    # That is exactly how prd broke: image ubuntu24/20260810.271 moved the
    # preinstalled CLI 3.253.0 -> 3.256.0, and 3.256.0 fails to write the R2
    # checkpoint with `InvalidDigest: The checksum or Content-MD5 you specified is
    # not valid` (S3 PutObject 400). The same inforge v6.1.3 binary succeeded on
    # the older image the day before. Pinning here makes the CLI a version we
    # control and bump deliberately, like any other dependency.
    - name: Install Pulumi CLI
      uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
      with:
        pulumi-version: ${{ inputs.pulumi-version }}

    - name: Install inforge
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        # install.sh is always fetched from the latest release; INFORGE_VERSION
        # pins which inforge binary it installs. install.sh is fetched to a file
        # and executed as a separate step, not piped straight from curl into sh,
        # so the whole script is on disk before any of it runs — a response that
        # is truncated or altered mid-flight can't execute the prefix that did
        # arrive. Same shape as wardnet/bulwark's own installer step.
        #
        # version must name a RELEASE (vX.Y.Z, optionally with a pre-release
        # suffix like v6.2.0-rc.1 — release.yml publishes assets for any
        # v*.*.* tag) or "latest". Reject anything else up front: the floating
        # major alias (`v6`) is a git tag with no release assets, so passing it
        # here used to surface only as a bare `curl: 404` at the asset URL.
        if [[ "${VERSION}" != "latest" && ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
          echo "::error::version '${VERSION}' is not a release — use a full release tag (e.g. v6.1.1) or 'latest'." \
            "A major alias like 'v6' selects the ACTION code in \`uses:\`, but has no release assets to install."
          exit 1
        fi
        if [[ "${VERSION}" != "latest" ]]; then
          export INFORGE_VERSION="${VERSION}"
        fi
        export INFORGE_INSTALL_DIR="${RUNNER_TEMP}/inforge-bin"
        curl -fsSL -o "${RUNNER_TEMP}/inforge-install.sh" https://github.com/wardnet/inforge/releases/latest/download/install.sh
        sh "${RUNNER_TEMP}/inforge-install.sh"
        echo "${INFORGE_INSTALL_DIR}" >> "$GITHUB_PATH"

    - name: Install provider plugins
      shell: bash
      run: inforge plugins install
