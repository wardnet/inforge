nodeLinker: node-modules

# Wait 7 days before resolving a newly published version of any package: the
# window right after publication is when a compromised maintainer account or a
# typosquat is most likely to still be live and least likely to have been caught.
# Mirrors the 7-day cooldown dependabot.yml already applies to what it proposes.
npmMinimalAgeGate: "7d"
