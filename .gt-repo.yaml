# Repository governance for gt. This file is the source of truth; run
# 'gt repo sync' to render it, and 'gt repo check' to verify.
#
# Shared policy (Dependabot cooldown, commit-message prefixes, the weekly sync
# schedule) lives in gt's templates, not here, so it stays consistent across
# every governed repo.
#
# The pipeline stages below become jobs in ci-orchestration.yml, each calling a
# ci-*/cd-* workflow that belongs to this repository: gt creates those once and
# never touches them again. Branch protection needs exactly one check, ci-gate,
# which waits on all of them.

gt_version: v1.0.0
dependabot:
  - ecosystem: github-actions
    directory: /
  - ecosystem: gomod
    directory: /
    groups:
      - name: pulumi
        applies_to: version-updates
        patterns:
          - github.com/pulumi/pulumi
          - github.com/pulumi/pulumi/*
          - github.com/pulumi/pulumi-go-provider
        note: |
          The pulumi core modules are released in lockstep and must move
          together: sdk/v3 and pkg/v3 share an internal API
          (plugin.NewContextWithRoot et al.), and pulumi-go-provider tracks
          pulumi/pkg/v3's codegen/schema types. Bumping any one alone produces
          an unbuildable tree.

          applies_to keeps this to routine version updates, so a security
          advisory on any of these is still raised as its own immediate PR
          rather than waiting to be batched.
  - ecosystem: npm
    directory: /website
    note: |
      The Docusaurus docs site. Deliberately out of scope for bulwark
      (.bulwark.yml sets typescript.enabled: false), but its dependencies
      still need updating.
dependabot_auto_merge:
  enabled: true
  schedule: 0 1 * * *
  max_bump: minor
  delete_branch: true
bulwark:
  # Off. ci.yml already runs bulwark, consuming build-test's coverage artifact,
  # and gt's stage would be a second run competing for the same baselines on the
  # bulwark-state branch. It goes on in the PR that moves that job into ci-test.
  enabled: false
pipeline:
  ci:
    enabled: true
    stages:
      - preflight
      - build
      - test
    merge_queue: false
  # Off: cd-orchestration fires on v*.*.*, which release.yml already owns, and
  # its verify-attestation runs with require: true — no tree carries an
  # attestation yet, so the next release would go red on a pipeline that ships
  # nothing.
  cd:
    enabled: false
    stages:
      - preflight
      - publish
      - deploy
      - verify
    tags:
      - v*.*.*
conventional_commits:
  enabled: true
  scope: pr_title
  types:
    - feat
    - fix
    - docs
    - style
    - refactor
    - perf
    - test
    - build
    - ci
    - chore
    - revert
settings:
  merge:
    squash: true
    merge_commit: false
    rebase: false
    delete_branch_on_merge: true
  branch_protection:
    branch: main
    required_approvals: 0
    require_up_to_date: false
files:
  - sync
  - dependabot-auto-merge
