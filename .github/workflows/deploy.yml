name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Stack name / environment to deploy (e.g. prd)
        type: string
        required: true
      stack_config:
        description: Path to the stack config file (e.g. inforge.prd.yaml)
        type: string
        required: true

jobs:
  deploy:
    name: deploy / ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: wardnet/inforge/.github/actions/install@v1

      - name: Get OIDC token
        id: oidc
        run: |
          TOKEN=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=inforge-escrow-worker.workers.dev" \
            | jq -r '.value')
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: inforge deploy
        id: deploy
        run: |
          inforge deploy --yes \
            --stack  "${{ inputs.environment }}" \
            --stack-config "${{ inputs.stack_config }}" \
            --output json \
            --allow-multiple \
            > /tmp/deploy.json 2> >(tee /tmp/deploy-human.txt >&2)
        env:
          INFORGE_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          INFORGE_ESCROW_TTL_SECONDS: "600"
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          SSH_AUTHORIZED_KEYS: ${{ secrets.SSH_AUTHORIZED_KEYS }}
          DEPLOY_PUBLIC_KEY: ${{ secrets.DEPLOY_PUBLIC_KEY }}

      - name: Render HTML report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ENV="${{ inputs.environment }}"
          STATUS="${{ job.status }}"
          ICON=$([[ "$STATUS" == "success" ]] && echo "✅" || echo "❌")

          CREATE=$(jq -r '.summary.create // 0' /tmp/deploy.json 2>/dev/null || echo 0)
          UPDATE=$(jq -r '.summary.update // 0' /tmp/deploy.json 2>/dev/null || echo 0)
          DELETE=$(jq -r '.summary.delete // 0' /tmp/deploy.json 2>/dev/null || echo 0)
          SAME=$(jq -r '.summary.same // 0' /tmp/deploy.json 2>/dev/null || echo 0)

          HUMAN=$(cat /tmp/deploy-human.txt 2>/dev/null || echo "No output captured.")

          HTML="<h3>${ICON} inforge deploy — <code>${ENV}</code></h3>
          <table>
          <tr><th>➕ Created</th><th>✏️ Updated</th><th>🗑️ Deleted</th><th>= Unchanged</th></tr>
          <tr>
            <td style='color:green;font-weight:bold'>${CREATE}</td>
            <td style='color:orange;font-weight:bold'>${UPDATE}</td>
            <td style='color:red;font-weight:bold'>${DELETE}</td>
            <td>${SAME}</td>
          </tr>
          </table>
          <details><summary>Full output</summary>

          <pre>${HUMAN}</pre>
          </details>"

          echo "$HTML" >> "$GITHUB_STEP_SUMMARY"

          if [[ -n "$PR_NUMBER" ]]; then
            gh pr comment "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              --body "$HTML"
          fi
