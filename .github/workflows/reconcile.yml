name: Reconcile

on:
  workflow_call:
    inputs:
      base_ref:
        description: Base git ref for the matrix diff (default main)
        type: string
        default: main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base git ref for the matrix diff
        type: string
        default: main

jobs:
  matrix:
    name: compute matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      environments: ${{ steps.matrix.outputs.environments }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: wardnet/inforge/.github/actions/install@v1

      - name: compute environment matrix
        id: matrix
        run: |
          ENVS=$(inforge matrix --base "${{ inputs.base_ref || 'main' }}" --head HEAD)
          echo "environments=${ENVS}" >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy / ${{ matrix.environment }}
    needs: matrix
    if: needs.matrix.outputs.environments != '[]'
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
    strategy:
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.environments) }}
    steps:
      - uses: actions/checkout@v6

      - uses: wardnet/inforge/.github/actions/install@v1

      - name: inforge deploy
        run: |
          inforge deploy --yes \
            --stack  "${{ matrix.environment }}" \
            --stack-config "${{ matrix.stack_config }}"
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          SSH_AUTHORIZED_KEYS: ${{ secrets.SSH_AUTHORIZED_KEYS }}
          DEPLOY_PUBLIC_KEY: ${{ secrets.DEPLOY_PUBLIC_KEY }}
