name: Validate

on:
  workflow_call:
    inputs:
      base_ref:
        description: Base git ref for changed-environment detection
        type: string
        default: main

jobs:
  matrix:
    name: compute matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      environments: ${{ steps.matrix.outputs.environments }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: wardnet/inforge/.github/actions/install@v1

      - name: compute environment matrix
        id: matrix
        run: |
          BASE="${{ inputs.base_ref }}"
          ENVS=$(inforge matrix --base "$BASE" --head HEAD)
          echo "environments=${ENVS}" >> "$GITHUB_OUTPUT"

  validate:
    name: validate / ${{ matrix.environment }}
    needs: matrix
    if: needs.matrix.outputs.environments != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.environments) }}
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: wardnet/inforge/.github/actions/install@v1

      - name: inforge validate
        id: validate
        run: |
          set -euo pipefail
          inforge validate "${{ matrix.environment }}" 2>&1 | tee /tmp/validate.txt

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT=$(cat /tmp/validate.txt 2>/dev/null || echo "No output captured.")
          ICON=$([[ "${{ job.status }}" == "success" ]] && echo "✅" || echo "❌")
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "${ICON} **inforge validate — \`${{ matrix.environment }}\`**
          <details><summary>Output</summary>

          \`\`\`
          ${OUTPUT}
          \`\`\`
          </details>"
