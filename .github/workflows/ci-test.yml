# ci-test — this file is yours.
#
# gt created it once and will never modify or delete it again. It is called by
# ci-orchestration.yml and must keep `workflow_call`, or the orchestrator loses
# the stage.
#
# This is ci.yml's build-test job minus the `go build` that moved to ci-build.
#
# The coverage artifact is named `gt-coverage`, not ci.yml's `coverage-out`:
# that exact name is the contract gt's bulwark stage consumes, and it mirrors
# the artifact's tree into the scan root before bulwark runs. This is a single
# Go module rooted at the repository, so one coverage.out at the artifact's top
# level lands exactly where bulwark looks. .bulwark.yml already declares
# `coverage.source: report`, which is what makes that read rather than a second
# run of the suite.
name: ci-test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The Automation API tests (cmd/inforge: createStack/selectStack, the ephemeral
      # post-up deploy-key resolution) drive a real Pulumi engine against a throwaway
      # file:// backend, and the Automation API shells out to the `pulumi` binary. They
      # t.Skip when it is absent — so without this step the ephemeral teardown/key
      # guards they protect would silently go untested on every CI run. No `command:`
      # input: the action then only installs the CLI (no login, no credentials).
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: "3.253.0"

      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gt-coverage
          path: coverage.out
          retention-days: 1
