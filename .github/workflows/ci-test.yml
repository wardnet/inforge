# ci-test — this file is yours.
#
# gt created it once and will never modify or delete it again.
#
# The coverage profile is uploaded as `gt-coverage`, which the bulwark stage
# consumes instead of running the suite a second time. That replaces the
# bulwark job this repository used to run itself.
name: ci-test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.6"
          cache: true

      # The Automation API tests (cmd/inforge: createStack/selectStack, the ephemeral
      # post-up deploy-key resolution) drive a real Pulumi engine against a throwaway
      # file:// backend, and the Automation API shells out to the `pulumi` binary. They
      # t.Skip when it is absent — so without this step the ephemeral teardown/key
      # guards they protect would silently go untested on every CI run. No `command:`
      # input: the action then only installs the CLI (no login, no credentials).
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: "3.251.0"

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gt-coverage
          path: coverage.out
          retention-days: 1
