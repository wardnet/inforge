name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.26"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.26"
          cache: true

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-out
          path: coverage.out
          retention-days: 1

  bulwark:
    name: bulwark
    needs: build-test  # fail fast: bulwark coverage runs go test itself and would fail the same
                        # way build-test just did, but only after installing gosec/govulncheck/
                        # semgrep first — no point paying that cost on a build we already know is broken
    runs-on: ubuntu-latest
    permissions:
      contents: write       # bulwark coverage caches baselines on the bulwark-state branch
      pull-requests: write  # for the PR summary comment
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0    # bulwark coverage needs full history to resolve the PR's base commit

      - uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.26"
          cache: true

      # build-test's own `go test -race -coverprofile=coverage.out ./...` is the
      # only place tests run — downloading its output here instead of having
      # bulwark coverage execute the suite a second time under --tests=run.
      - uses: actions/download-artifact@v8.0.1
        with:
          name: coverage-out

      - uses: wardnet/bulwark@feature/pr-summary-collapsed-details
        with:
          tests-mode: skip
          go-report: coverage.out
