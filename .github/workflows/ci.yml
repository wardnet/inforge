name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.6"
          cache: true

      # The Automation API tests (cmd/inforge: createStack/selectStack, the ephemeral
      # post-up deploy-key resolution) drive a real Pulumi engine against a throwaway
      # file:// backend, and the Automation API shells out to the `pulumi` binary. They
      # t.Skip when it is absent — so without this step the ephemeral teardown/key
      # guards they protect would silently go untested on every CI run. No `command:`
      # input: the action then only installs the CLI (no login, no credentials).
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: "3.251.0"

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-out
          path: coverage.out
          retention-days: 1

  bulwark:
    name: bulwark
    needs: build-test  # fail fast: bulwark coverage runs go test itself and would fail the same
                        # way build-test just did, but only after installing gosec/govulncheck/
                        # semgrep first — no point paying that cost on a build we already know is broken
    runs-on: ubuntu-latest
    permissions:
      contents: write       # bulwark coverage caches baselines on the bulwark-state branch
      pull-requests: write  # for the PR summary comment
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0    # bulwark coverage needs full history to resolve the PR's base commit

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.6"
          cache: true

      # build-test's own `go test -race -coverprofile=coverage.out ./...` is the
      # only place tests run — downloading its output here instead of having
      # bulwark coverage execute the suite a second time under --tests=run.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-out

      # Every third-party action above is SHA-pinned, because a tag they own can be
      # silently repointed at code we never reviewed. bulwark is ours: the floating
      # `v1` major alias is its intended delivery channel, moved deliberately on each
      # release so consumers pick up scanner fixes without a bump PR each time. Pinning
      # it would trade that for nothing — the supply-chain risk the rule guards against
      # is the same risk we'd be taking on our own repo either way.
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: wardnet/bulwark@v1
        with:
          # No coverage inputs: bulwark v1.7.0 removed tests-mode/go-report in
          # favour of `coverage.source` in .bulwark.yml at the scan root. The
          # artifact above lands coverage.out at that root, which is the first
          # path bulwark's own candidate search checks, so no override is needed.
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          semgrep-app-token: ${{ secrets.SEMGREP_APP_TOKEN }}

  # The single job the branch-protection ruleset actually requires. Individual
  # job names are an implementation detail that changes as CI evolves —
  # pointing the ruleset at each one means every job rename/add/remove is
  # also a ruleset edit, and a job left off the required list can fail
  # silently without blocking a merge. Add a job to `needs:` below and the
  # gate covers it automatically; the ruleset itself never needs to change.
  pr-gate:
    name: PR Gate
    if: always()
    needs: [lint, build-test, bulwark]
    runs-on: ubuntu-latest
    steps:
      - name: Require all upstream jobs to have succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*|*skipped*)
              echo "one or more required jobs did not succeed" >&2
              exit 1
              ;;
          esac
