name: Service Release

# Reusable workflow for releasing a service to a target environment.
# Service repos call this after building their artifact:
#
#   uses: wardnet/inforge/.github/workflows/service-release.yml@v1
#   with:
#     service: api-server
#     environment: qa
#   secrets:
#     deploy_ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
#
# Reads deployments/inforge.yaml (platform + service list) and
# deployments/<service>.yaml (per-env artifact path) from the calling repo.
# Resolves the deploy target (host, folder, unit) from the infra Pulumi stack
# at runtime — no descriptor file needs to be committed anywhere.

on:
  workflow_call:
    inputs:
      service:
        description: Service name (must match deployments/<service>.yaml)
        required: true
        type: string
      environment:
        description: Target environment (e.g. qa, prd)
        required: true
        type: string
      stack_config:
        description: "Path to the infra stack config file (default: inforge.<env>.yaml)"
        required: false
        default: ""
        type: string
      deploy_dir:
        description: "Path to the deployments directory (default: ./deployments)"
        required: false
        default: ./deployments
        type: string
      sha:
        description: "Artifact SHA to push + deploy (default: the triggering commit)"
        required: false
        default: ""
        type: string
      dry_run:
        description: Resolve and print the deploy target without delivering
        required: false
        default: false
        type: boolean
    secrets:
      deploy_ssh_key:
        description: Private SSH deploy key for the target host
        required: true

permissions:
  contents: read

# One release per service+environment at a time. The manifest write is also
# guarded by an If-Match compare-and-swap (ADR-0016), so a direct-from-laptop
# `inforge releases deploy` stays safe even outside this serialisation.
concurrency:
  group: inforge-release-${{ inputs.service }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  release:
    name: release / ${{ inputs.service }} → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SHA: ${{ inputs.sha != '' && inputs.sha || github.sha }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      INFORGE_DEPLOY_KEY: ~/.ssh/deploy_key
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: wardnet/inforge/.github/actions/install@v1

      - name: Write SSH deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.deploy_ssh_key }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # Push the built artifact to the release store (skipped on a dry run — there
      # is nothing to upload when we only want to resolve the target).
      - name: inforge releases push
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          inforge releases push \
            --service    "${{ inputs.service }}" \
            --env        "${{ inputs.environment }}" \
            --sha        "$SHA" \
            --deploy-dir "${{ inputs.deploy_dir }}"

      - name: inforge releases deploy
        run: |
          set -euo pipefail
          inforge releases deploy \
            --service    "${{ inputs.service }}" \
            --env        "${{ inputs.environment }}" \
            --sha        "$SHA" \
            --deploy-dir "${{ inputs.deploy_dir }}" \
            ${{ inputs.stack_config != '' && format('--stack-config "{0}"', inputs.stack_config) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}
