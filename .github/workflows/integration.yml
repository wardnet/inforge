name: Integration

# Contract tests that run the provider clients against a real, self-hosted
# dependency (currently Infisical) brought up via docker compose. Kept separate
# from the fast CI gates: it runs only when the relevant provider changes, on a
# nightly schedule (to catch upstream API drift against the pinned image), and on
# demand.
on:
  pull_request:
    branches: [main]
    paths:
      - "providers/infisical/**"
      - ".github/workflows/integration.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infisical:
    name: infisical provider contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      # TestMain brings up testdata/docker-compose.yml, waits for /api/status,
      # runs the adopt-or-create chain against the real Infisical API, then tears
      # it down. ubuntu-latest ships docker compose, which is the default the
      # harness uses (INFISICAL_COMPOSE), so no extra setup is needed.
      - name: integration tests (self-hosted Infisical)
        run: go test -tags=integration -timeout 10m ./providers/infisical/internal/client/...
