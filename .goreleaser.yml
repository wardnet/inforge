# goreleaser configuration for inforge.
#
# Builds three binaries from a single repository:
#   - inforge                  the CLI
#   - inforge-agent        on-host runtime agent (service ExecStart)
#   - pulumi-resource-neon     Pulumi provider plugin (Neon)
#
# The provider binary must keep the `pulumi-resource-<name>` naming
# convention exactly — Pulumi locates plugins by that filename. inforge-agent
# is downloaded onto each host by `inforge deploy` from the raw archive, pinned to
# the deploying inforge version.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  # The CLI also ships for darwin/arm64 — developers run it on their own
  # machines (and self-update via `inforge update`); everything else only ever
  # runs on Linux hosts or CI.
  - id: inforge
    main: ./cmd/inforge
    binary: inforge
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
    ldflags:
      - -s -w -X main.version={{ .Version }}

  - id: inforge-agent
    main: ./cmd/inforge-agent
    binary: inforge-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

  - id: pulumi-resource-neon
    main: ./providers/neon/cmd/pulumi-resource-neon
    binary: pulumi-resource-neon
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

# One archive per binary so consumers download only what they need:
# `inforge plugins install neon` pulls the Neon provider archive alone,
# never the whole release. A fourth archive publishes every binary in raw,
# uncompressed form for curl-and-run usage.
archives:
  - id: inforge
    ids:
      - inforge
    name_template: >-
      inforge_{{ .Version }}_{{ .Os }}_{{ .Arch }}

  - id: pulumi-resource-neon
    ids:
      - pulumi-resource-neon
    name_template: >-
      pulumi-resource-neon_{{ .Version }}_{{ .Os }}_{{ .Arch }}

  # Raw, uncompressed binaries — download a single os/arch binary and run it
  # directly, no extraction step.
  - id: raw
    ids:
      - inforge
      - inforge-agent
      - pulumi-resource-neon
    formats:
      - binary
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: wardnet
    name: inforge
  # The curl|sh installer ships with every release so it can be fetched from
  # the stable releases/latest/download/install.sh URL.
  extra_files:
    - glob: scripts/install.sh
  # Standing description prepended to every release; the auto-generated
  # changelog (see `changelog:` above) is appended below it.
  header: |
    ## inforge

    A Go toolchain that turns declarative infrastructure definitions into real
    deployments via Pulumi and GitHub Actions.

    This release ships three statically-linked binaries: the `inforge` CLI, the
    `inforge-agent` on-host runtime agent, and the `pulumi-resource-neon`
    provider plugin.

    **Install / update**

    ```sh
    curl -fsSL https://github.com/wardnet/inforge/releases/latest/download/install.sh | sh
    ```

    `inforge plugins install` pulls the provider plugins it needs from the matching
    release; `inforge update` self-updates the CLI in place.
